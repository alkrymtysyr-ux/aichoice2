<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIChoice — البحث والمقارنة بين الأدوات</title><meta name="description" content="محرك بحث عربي لاكتشاف ومقارنة أدوات الذكاء الاصطناعي والبرامج الرقمية."><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif;line-height:1.7}header{background:#fff;border-bottom:1px solid #e1e5ed;padding:16px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900;color:#3157d5}nav a{color:#475066;text-decoration:none;margin-right:18px}main{max-width:1100px;margin:auto;padding:35px 18px 60px}.hero{text-align:center;padding:25px 0}.hero h1{font-size:clamp(34px,6vw,52px);margin:10px 0}.hero p{color:#667085}.search{max-width:760px;margin:25px auto;display:flex;background:#fff;border:1px solid #dce1eb;border-radius:14px;padding:5px}.search input{flex:1;border:0;outline:0;padding:14px;font-size:17px}.search button{border:0;border-radius:10px;padding:0 15px}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chip{border:1px solid #d9deea;background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer}.chip.active{background:#3157d5;color:#fff}.bar{display:flex;justify-content:space-between;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:20px;display:flex;flex-direction:column;min-height:245px}.muted{color:#697386;font-size:14px}.desc{flex:1}.actions{display:flex;gap:8px}.btn{flex:1;text-align:center;padding:9px;border-radius:9px;text-decoration:none;border:1px solid #dce1eb;color:#26324b}.primary{background:#3157d5;color:#fff;border-color:#3157d5}.empty{text-align:center;background:#fff;border:1px dashed #ccd3df;padding:30px;border-radius:16px;grid-column:1/-1}footer{text-align:center;background:#fff;border-top:1px solid #e1e5ed;color:#778197;padding:25px}@media(max-width:600px){nav{font-size:13px}nav a{margin-right:7px}}</style></head><body><header><a class="logo" href="./">AIChoice</a><nav><a href="./">الرئيسية</a><a href="compare.html">المقارنة</a><a href="about.html">عن المنصة</a></nav></header><main><section class="hero"><b>محرك بحث ومقارنة</b><h1>ابحث عن الأداة المناسبة لك</h1><p>اكتب ما تحتاجه، ثم اكتشف الأدوات المناسبة وقارن بينها.</p><div class="search"><input id="q" placeholder="مثال: تصميم، فيديو، تسويق، كتابة..."><button id="clear">مسح</button></div><div id="cats" class="chips"></div></section><div class="bar"><strong id="count"></strong><select id="sort"><option value="rating">الأعلى تقييمًا</option><option value="name">الاسم</option></select></div><section id="results" class="grid"></section></main><footer>AIChoice © 2026</footer><script>const tools=[['Semrush','التسويق',4.7,'تحليل SEO والكلمات المفتاحية والمنافسين','https://www.semrush.com/'],['Shopify','التجارة الإلكترونية',4.6,'إنشاء وإدارة متجر إلكتروني','https://www.shopify.com/'],['HubSpot','الأعمال',4.6,'CRM وأدوات التسويق والمبيعات','https://www.hubspot.com/'],['Webflow','التصميم',4.5,'بناء مواقع احترافية بصريًا','https://webflow.com/'],['Canva','التصميم',4.7,'تصميم الصور والعروض والفيديو','https://www.canva.com/'],['Notion','الإنتاجية',4.6,'إدارة الملاحظات والمشاريع','https://www.notion.com/'],['Grammarly','الكتابة',4.5,'تحسين الكتابة والتدقيق','https://www.grammarly.com/'],['Descript','الفيديو',4.4,'تحرير الفيديو والصوت','https://www.descript.com/'],['Zapier','الأتمتة',4.5,'ربط التطبيقات وأتمتة المهام','https://zapier.com/']];let cat='الكل',q=document.getElementById('q');document.getElementById('cats').innerHTML=['الكل',...new Set(tools.map(x=>x[1]))].map(x=>`<button class="chip ${x==='الكل'?'active':''}" data-cat="${x}">${x}</button>`).join('');function render(){let s=q.value.toLowerCase(),a=tools.filter(x=>(cat==='الكل'||x[1]===cat)&&x.join(' ').toLowerCase().includes(s));if(document.getElementById('sort').value==='name')a.sort((x,y)=>x[0].localeCompare(y[0]));else a.sort((x,y)=>y[2]-x[2]);document.getElementById('count').textContent=a.length+' أداة';document.getElementById('results').innerHTML=a.length?a.map(x=>`<article class="card"><div class="muted">${x[1]}</div><h2>${x[0]}</h2><div class="muted">★ ${x[2]}</div><p class="desc">${x[3]}</p><div class="actions"><a class="btn" href="compare.html">مقارنة</a><a class="btn primary" href="${x[4]}" target="_blank" rel="nofollow sponsored noopener">الموقع الرسمي</a></div></article>`).join(''):'<div class="empty">لا توجد نتائج. جرّب كلمة أخرى.</div>'}document.addEventListener('click',e=>{if(e.target.dataset.cat){cat=e.target.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===e.target));render()}});q.oninput=render;document.getElementById('sort').onchange=render;document.getElementById('clear').onclick=()=>{q.value='';render()};render();</script></body></html>
